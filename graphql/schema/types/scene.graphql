type SceneFileType {
  size: String
  duration: Float
  video_codec: String
  audio_codec: String
  width: Int
  height: Int
  framerate: Float
  bitrate: Int
}

type ScenePathsType {
  screenshot: String # Resolver
  preview: String # Resolver
  stream: String # Resolver
  webp: String # Resolver
  vtt: String # Resolver
  sprite: String # Resolver
  funscript: String # Resolver
  interactive_heatmap: String # Resolver
  audio_waveform: String # Resolver
  caption: String # Resolver
}

type SceneMovie {
  movie: Movie!
  scene_index: Int
}

type SceneGroup {
  group: Group!
  scene_index: Int
}

type SceneIgnoredRange {
  id: ID!
  start_seconds: Float!
  end_seconds: Float!
}

type VideoCaption {
  language_code: String!
  caption_type: String!
}

enum SceneType {
  "A regular scene backed by its own media file."
  NORMAL
  "A scene whose media file is the source for one or more virtual scenes."
  MOVIE
  "A time range within a movie's media file; it has no independent physical file."
  VIRTUAL
}

type Scene {
  id: ID!
  "The scene kind. Plugins that do not need to distinguish scenes can ignore this field."
  type: SceneType!
  "The source movie ID for a virtual scene; null for normal scenes and movies."
  source_scene_id: ID
  "The source movie for a virtual scene; null for normal scenes and movies."
  source_scene: Scene
  "Ignored ranges defined on a movie; empty for normal and virtual scenes."
  ignored_ranges: [SceneIgnoredRange!]!
  "The virtual scene start offset, in seconds; null for normal scenes and movies."
  start_seconds: Float
  "The virtual scene end offset, in seconds; null for normal scenes and movies."
  end_seconds: Float
  "The preferred cover offset, in seconds; null when no explicit offset is set."
  cover_seconds: Float
  title: String
  code: String
  details: String
  director: String
  url: String @deprecated(reason: "Use urls")
  urls: [String!]!
  date: String
  production_date: String
  # rating expressed as 1-100
  rating100: Int
  organized: Boolean!
  o_counter: Int
  interactive: Boolean!
  interactive_speed: Int
  captions: [VideoCaption!]
  created_at: Time!
  updated_at: Time!
  "The last time play count was updated"
  last_played_at: Time
  "The time index a scene was left at"
  resume_time: Float
  "The total time a scene has spent playing"
  play_duration: Float
  "The number ot times a scene has been played"
  play_count: Int

  "Times a scene was played"
  play_history: [Time!]!
  "Times the o counter was incremented"
  o_history: [Time!]!

  files: [VideoFile!]!
  paths: ScenePathsType! # Resolver
  scene_markers: [SceneMarker!]!
  galleries: [Gallery!]!
  studio: Studio
  groups: [SceneGroup!]!
  movies: [SceneMovie!]! @deprecated(reason: "Use groups")
  tags: [Tag!]!
  performers: [Performer!]!
  stash_ids: [StashID!]!

  custom_fields: Map!

  "Return valid stream paths"
  sceneStreams: [SceneStreamEndpoint!]!
}

input SceneMovieInput {
  movie_id: ID!
  scene_index: Int
}

input SceneGroupInput {
  group_id: ID!
  scene_index: Int
}

input SceneCreateInput {
  title: String
  code: String
  details: String
  director: String
  url: String @deprecated(reason: "Use urls")
  urls: [String!]
  date: String
  production_date: String
  # rating expressed as 1-100
  rating100: Int
  organized: Boolean
  studio_id: ID
  gallery_ids: [ID!]
  performer_ids: [ID!]
  groups: [SceneGroupInput!]
  movies: [SceneMovieInput!] @deprecated(reason: "Use groups")
  tag_ids: [ID!]
  "This should be a URL or a base64 encoded data URL"
  cover_image: String
  stash_ids: [StashIDInput!]

  """
  The first id will be assigned as primary.
  Files will be reassigned from existing scenes if applicable.
  Files must not already be primary for another scene.
  """
  file_ids: [ID!]

  custom_fields: Map
}

input SceneUpdateInput {
  clientMutationId: String
  id: ID!
  title: String
  code: String
  details: String
  director: String
  url: String @deprecated(reason: "Use urls")
  urls: [String!]
  date: String
  production_date: String
  # rating expressed as 1-100
  rating100: Int
  o_counter: Int
    @deprecated(reason: "Unsupported - Use sceneIncrementO/sceneDecrementO")
  organized: Boolean
  studio_id: ID
  gallery_ids: [ID!]
  performer_ids: [ID!]
  groups: [SceneGroupInput!]
  movies: [SceneMovieInput!] @deprecated(reason: "Use groups")
  tag_ids: [ID!]
  "This should be a URL or a base64 encoded data URL"
  cover_image: String
  stash_ids: [StashIDInput!]

  "The time index a scene was left at"
  resume_time: Float
  "The total time a scene has spent playing"
  play_duration: Float
  "The number ot times a scene has been played"
  play_count: Int
    @deprecated(
      reason: "Unsupported - Use sceneIncrementPlayCount/sceneDecrementPlayCount"
    )

  primary_file_id: ID

  custom_fields: CustomFieldsInput
}

input VirtualSceneCreateInput {
  source_scene_id: ID!
  title: String
  start_seconds: Float!
  end_seconds: Float!
  cover_seconds: Float
}

input VirtualSceneUpdateInput {
