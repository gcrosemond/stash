fragment SceneData on Scene {
  id
  type
  source_scene_id
  source_scene {
    id
    title
  }
  ignored_ranges {
    id
    start_seconds
    end_seconds
  }
  start_seconds
  end_seconds
  cover_seconds
  title
  code
  details
  director
  urls
  date
  production_date
  rating100
  o_counter
  organized
  interactive
  interactive_speed
  captions {
    language_code
    caption_type
  }
  created_at
  updated_at
  resume_time
  last_played_at
  play_duration
  play_count

  play_history
  o_history

  files {
    ...VideoFileData
  }

  paths {
    screenshot
    preview
    stream
    webp
    vtt
    sprite
    funscript
    interactive_heatmap
    audio_waveform
    caption
  }

  scene_markers {
    ...SceneMarkerData
  }

  galleries {
    ...SlimGalleryData
  }

  studio {
    ...SlimStudioData
  }

  groups {
    group {
      ...GroupData
    }
    scene_index
  }

  tags {
    ...SlimTagData
  }

  performers {
    ...PerformerData
  }

  stash_ids {
    endpoint
    stash_id
    updated_at
  }

  sceneStreams {
    url
    mime_type
    label
  }

  custom_fields
}

fragment SelectSceneData on Scene {
  id
  type
  source_scene_id
  start_seconds
  end_seconds
  cover_seconds
  title
  date
  production_date
  code
  studio {
    name
  }
  files {
    path
  }
  paths {
    screenshot
  }
}
